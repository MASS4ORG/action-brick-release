name: Brick verify

# Called from a brick repository on pushes and pull requests:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   jobs:
#     brick:
#       uses: MASS4ORG/brick-workflows/.github/workflows/verify.yml@v1
#       with:
#         source-tests: Brick~/Tests/My.Brick.Tests/My.Brick.Tests.csproj
#
# Builds and tests with the same stable CLI selection used for a first release.
# Needs no secrets and publishes nothing.
on:
  workflow_call:
    inputs:
      brick-path:
        description: Brick folder in the calling repository
        type: string
        default: .
      precast:
        description: Compile assemblies before packing, which also proves they build
        type: boolean
        default: true
      twin:
        description: Also bake the brick and pack its twin, a variant of the same id and version
        type: boolean
        default: true
      turian-version:
        description: Exact stable CLI version override; empty resolves the highest stable semver image tag
        type: string
        default: ""
      source-test-dependency:
        description: 'Optional source-test companion checkout as JSON with repository, ref and path (under Bricks)'
        type: string
        default: '{}'
      source-tests:
        description: Test project under the brick; empty when the brick has none
        type: string
        default: ""
      turian-ref:
        description: Optional development source override; empty uses the selected CLI release sources
        type: string
        default: ""

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - name: Select the verification image
        id: image
        uses: MASS4ORG/brick-workflows/resolve@v1
        with:
          turian-version: ${{ inputs.turian-version }}

  # The brick's own tests, built against Turian's sources checked out beside it as on a workstation.
  source-tests:
    needs: image
    if: inputs.source-tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Bricks/brick
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MASS4ORG/Turian
          ref: ${{ inputs.turian-ref != '' && inputs.turian-ref || format('v{0}', needs.image.outputs.version) }}
          path: Turian
          persist-credentials: false

      - name: Check out the source-test dependency
        if: inputs.source-test-dependency != '{}'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(inputs.source-test-dependency).repository }}
          ref: ${{ fromJSON(inputs.source-test-dependency).ref }}
          path: Bricks/${{ fromJSON(inputs.source-test-dependency).path }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: Turian/global.json

      # From Turian, whose global.json selects the Microsoft.Testing.Platform runner that --project needs.
      - name: Build and test the sources
        working-directory: Turian
        run: dotnet test --project "../Bricks/brick/${{ inputs.brick-path }}/${{ inputs.source-tests }}" -p:SkipShaders=true

  brick:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test as a consumer
        id: build
        uses: MASS4ORG/brick-action-build@v1
        with:
          brick-path: ${{ inputs.brick-path }}
          precast: ${{ inputs.precast }}
          twin: ${{ inputs.twin }}
          image: ${{ needs.image.outputs.image }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brick
          path: |
            ${{ steps.build.outputs.directory }}/*.brick
            ${{ steps.build.outputs.directory }}/build.json
          if-no-files-found: error
