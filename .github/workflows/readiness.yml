name: Manual brick preflight

on:
  workflow_dispatch:
    inputs:
      package-id:
        description: Brick package id
        required: true
        type: string
      version:
        description: Prospective brick version
        required: true
        type: string
      publisher-public-key:
        description: Optional OpenSSH public key for identity-specific checks
        default: ''
        type: string
      turian-version:
        description: Optional exact stable CLI version
        default: ''
        type: string
      store-url:
        description: Store URL
        default: https://bricks.mass4.org
        type: string

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select the preflight image
        id: image
        uses: MASS4ORG/action-brick-release/resolve@v1
        with:
          turian-version: ${{ inputs.turian-version }}
      - name: Check public readiness
        uses: MASS4ORG/action-brick-publish/readiness@v1
        with:
          package-id: ${{ inputs.package-id }}
          version: ${{ inputs.version }}
          image: ${{ steps.image.outputs.image }}
          verified-version: ${{ steps.image.outputs.version }}
          store-url: ${{ inputs.store-url }}
          public-key: ${{ inputs.publisher-public-key }}
          public-only: 'true'
